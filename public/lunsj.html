<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ekstra lunsj</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forsinkelser">
<meta name="theme-color" content="#0E3B2E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--surface:#fff;--ink:#16202B;--mute:#5E6C7A;--line:#D5DDE4;--accent:#D6336C;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161C;--surface:#17212A;--ink:#E8EEF3;--mute:#93A1AE;--line:#2A3743;--accent:#FF6B9A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F161C;--surface:#17212A;--ink:#E8EEF3;--mute:#93A1AE;--line:#2A3743;--accent:#FF6B9A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;letter-spacing:-.035em;line-height:1;margin:16px 0 28px}
h2{font-size:1.05rem;font-weight:600;margin:36px 0 12px}
nav{display:flex;gap:16px;font-size:.95rem}
nav a{color:var(--mute);text-decoration:none;padding:6px 0}
nav a b{background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;font-size:.75rem;margin-left:4px}
nav a[aria-current]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}
.hero{border-bottom:2px solid var(--ink);padding-bottom:18px}
.hero small{display:block;color:var(--mute);font-size:.95rem}
.big{font-size:clamp(3rem,16vw,5.5rem);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:14px 10px 14px 0}
.stats div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.25rem;font-weight:600;letter-spacing:-.02em}
.stats span{color:var(--mute);font-size:.85rem}
.add{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;min-width:0;min-height:44px;-webkit-appearance:none;appearance:none}
input[type=date]{display:block;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row label{min-width:0}
@media (max-width:360px){.row{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px}
.chip{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px}
.chip:hover{border-color:var(--accent)}
.go{background:var(--accent);color:#fff;border:0;padding:12px;font-weight:600}
.err{color:var(--accent);font-size:.9rem;min-height:1.2em;margin:0}
.wk{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.wk .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.wk .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.wk em{font-style:normal;color:var(--mute);font-size:.8rem;display:block}
.wk .v{text-align:right;font-weight:600;white-space:nowrap}
.log{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.log small{display:block;color:var(--mute)}
.lead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 22px;color:var(--ink)}
.lead .cup{font-size:1.6rem;line-height:1}
.lead b{display:block;font-size:1rem}
.lead small{display:block;color:var(--mute);font-size:.82rem}
.lead .arr{margin-left:auto;color:var(--mute);font-size:1.2rem}
.chart{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;margin-top:8px;border-bottom:1px solid var(--line)}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bar.zero i{background:var(--line);opacity:1}
.bar .stk{display:flex;flex-direction:column-reverse;width:100%;max-width:26px;min-height:2px}
.bar .stk i{max-width:none;border-radius:0}
.bar .stk i:last-child{border-radius:4px 4px 0 0}
.bar .stk i.lu{background:var(--lunch)}
.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 6px;font-size:.88rem;min-height:40px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--mute);margin:8px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--accent)}
.legend span.lu::before{background:var(--lunch)}
.wlab span.now{color:var(--ink);font-weight:700}
.lunchline{margin:8px 0 0;color:var(--mute);font-size:.88rem}
.lunchline b{color:var(--lunch);font-weight:600}
.wk .t{display:flex}
.wk .t i.lu{background:var(--lunch);border-radius:0 5px 5px 0}
.wk .t i:not(:last-child){border-radius:5px 0 0 5px}
.bar.now i{opacity:1}
.bar span{position:absolute;font-size:.68rem;color:var(--mute);white-space:nowrap;padding-bottom:2px}
.avgl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute);opacity:.6;pointer-events:none}
.avgl em{position:absolute;right:0;top:-1.3em;font-style:normal;font-size:.68rem;color:var(--mute);background:var(--bg);padding-left:4px}
.wlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:.68rem;color:var(--mute);text-align:center;margin-top:4px}
.cnote{color:var(--mute);font-size:.8rem;margin:8px 0 0}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rec span{display:block;color:var(--mute);font-size:.82rem}
.rec b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1.2}
.rec small{display:block;color:var(--mute);font-size:.8rem}
.del{background:none;border:0;color:var(--mute);padding:6px;text-decoration:underline}
.more{background:none;border:0;color:var(--ink);text-decoration:underline;padding:10px 0}
.empty{color:var(--mute);padding:8px 0}
.note{color:var(--mute);font-size:.8rem;margin-top:32px}
.dup{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-left:3px solid var(--accent);padding:8px 10px;margin:0;font-size:.9rem;border-radius:4px}
[hidden]{display:none!important}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:22px 0 8px}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>summary small{color:var(--mute);font-weight:400;margin-left:auto;font-size:.85rem}
.foldBody{padding:0 16px 16px}
.foldBody h3{font-size:1rem;margin:20px 0 10px}
.foldBody .stats{margin-top:4px}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<main>
 <nav><a href="/#logg" data-page="0">Logg</a><a href="/#lunsj" data-page="1" aria-current="page">Lunsj</a><a href="/#betting" data-page="2">Betting</a></nav>
 <h1>Ekstra lunsj</h1>

 <section class="hero">
  <small>Ekstra lunsj denne uken</small>
  <div class="big" id="lwk">0 min</div>
  <p class="conv" id="lconv"></p>
 </section>

 <h2>Ny lunsj</h2>
 <div class="add">
  <div class="row">
   <label>Dato<input type="date" id="date"></label>
   <label>Minutter ekstra<input type="number" id="min" min="1" max="300" inputmode="numeric" placeholder="f.eks. 15"></label>
  </div>
  <div class="chips" id="chips"></div>
  <label>Notat (valgfritt)<input type="text" id="note" maxlength="80" placeholder="f.eks. «Lang kø i kantina»"></label>
  <p class="dup" id="dup" role="status" hidden></p>
  <p class="err" id="err" role="alert"></p>
  <button class="go" id="save">Legg til</button>
 </div>

 <h2>Oversikt</h2>
 <section class="stats">
  <div><b id="m30">0 min</b><span>Siste 30 dager</span></div>
  <div><b id="y1">0 min</b><span>Siste år</span></div>
  <div><b id="avg">0 min</b><span>Snitt per uke</span></div>
 </section>

 <h2>Alle registreringer</h2>
 <div id="log"></div>

 <p class="note"><span id="stat">Kobler til …</span> Lunsjminuttene telles med i statistikken og grafen på Logg-fanen. Uken starter mandag.</p>
</main>

<script>
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
const API='/api/lunsj';
let entries=[],code='',prevIds=null;
try{code=localStorage.getItem('forsinkelseslogg:kode')||''}catch(e){}
const saveCode=()=>{try{localStorage.setItem('forsinkelseslogg:kode',code)}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fmt=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' t'+(r?' '+r+' min':'')};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sum=a=>a.reduce((s,e)=>s+e.min,0);

[5,10,15,20,30].forEach(n=>{const b=el('button','chip',n+' min');b.type='button';b.onclick=()=>{$('min').value=n;$('min').focus()};$('chips').appendChild(b)});
$('date').value=iso(new Date());

async function api(method,body,q){
 const h={'content-type':'application/json'};if(code)h['x-skrivekode']=code;
 const r=await fetch(API+(q||''),{method,headers:h,body:body?JSON.stringify(body):undefined});
 if(r.status===401){const c=prompt(code?'Feil skrivekode. Prøv igjen:':'Skriv inn skrivekoden:');if(c){code=c.trim();saveCode();return api(method,body,q)}throw new Error('kode')}
 if(!r.ok)throw new Error(r.status);
 return r.json();
}
async function add(){
 const date=$('date').value,min=parseInt($('min').value,10);
 if(!date){$('err').textContent='Velg en dato.';return}
 if(!(min>=1&&min<=300)){$('err').textContent='Skriv inn antall minutter (1–300).';return}
 $('err').textContent='';$('save').disabled=true;
 let by='';try{by=localStorage.getItem('forsinkelseslogg:profil')||''}catch(e){}
 try{await api('POST',{date,min,note:$('note').value.trim(),by});$('min').value='';$('note').value='';await load();if(window.kasinoMsg)kasinoMsg('lunsj');tellLog()}
 catch(x){$('err').textContent=x.message==='kode'?'Ikke lagret: trenger skrivekode.':'Kunne ikke lagre. Prøv igjen.'}
 $('save').disabled=false;
}
async function remove(id){
 try{await api('DELETE',null,'?id='+encodeURIComponent(id));await load();tellLog()}
 catch(x){$('err').textContent=x.message==='kode'?'Ikke slettet: trenger skrivekode.':'Kunne ikke slette. Prøv igjen.'}
}
// The log page shows lunch in its totals and chart, so let it refresh right away.
function tellLog(){try{const f=parent.document.getElementById('f0');if(f&&f.contentWindow.load)f.contentWindow.load()}catch(e){}}
async function load(){
 try{
  const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;
  entries=(await r.json()).entries||[];
  $('stat').textContent='Delt liste: oppdateres automatisk for alle med lenken.';
 }catch(e){$('stat').textContent='Får ikke kontakt med serveren akkurat nå. Prøver igjen …'}
 render();
}
function checkDup(){
 const d=$('date').value,box=$('dup');
 const hit=d?entries.filter(e=>e.date===d):[];
 if(!hit.length){box.hidden=true;$('save').textContent='Legg til';return}
 const label=iso(new Date())===d?'i dag':parse(d).toLocaleDateString('nb-NO',{day:'numeric',month:'long'});
 box.textContent='Allerede registrert for '+label+': '+hit.map(e=>fmt(e.min)).join(', ')+'.';
 box.hidden=false;$('save').textContent='Legg til likevel';
}
$('date').addEventListener('change',checkDup);
$('save').onclick=add;
['min','note'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')add()}));

// The week's lunch minutes in workplace units.
const CONV=[
 m=>m>=15&&'= '+Math.round(m/15*2)/2+' gipsede hender som måtte vente',
 m=>m>=30&&'= '+Math.round(m/30*2)/2+' reponerte håndledd',
 m=>m>=40&&'= '+Math.round(m/40*2)/2+' CTS-inngrep uten assistent',
 m=>m>=3&&'= '+Math.round(m/3)+' par buddy loops som ikke ble lagt på',
 m=>m>=5&&'= '+Math.round(m/5)+' Aircaster som ikke ble tilpasset',
 m=>m>=10&&'= nok tid til å spise en lunsj til',
 m=>m>=2&&'= '+Math.round(m/1.5)+' kopper kaffe. Med påfyll.',
];
let lastWk=null;
function render(){
 checkDup();
 const today=new Date();today.setHours(0,0,0,0);
 const wk=monday(today).getTime(),tm=d=>parse(d).getTime();
 const w=sum(entries.filter(e=>monday(parse(e.date)).getTime()===wk));
 $('lwk').textContent=fmt(w);
 if(w!==lastWk){lastWk=w;const o=CONV.map(f=>f(w)).filter(Boolean);$('lconv').textContent=o.length?o[Math.floor(Math.random()*o.length)]:'Ingen ekstra lunsj denne uken. Matpakka er spist på rekordtid.'}
 const d30=new Date(today);d30.setDate(d30.getDate()-30);
 const d365=new Date(today);d365.setFullYear(d365.getFullYear()-1);
 $('m30').textContent=fmt(sum(entries.filter(e=>tm(e.date)>=d30.getTime()&&tm(e.date)<=today.getTime())));
 $('y1').textContent=fmt(sum(entries.filter(e=>tm(e.date)>=d365.getTime()&&tm(e.date)<=today.getTime())));
 const L=$('log');L.replaceChildren();
 if(!entries.length){$('avg').textContent='0 min';L.appendChild(el('p','empty','Ingen ekstra lunsj registrert ennå.'));return}
 const sorted=[...entries].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
 const first=monday(parse(sorted[sorted.length-1].date)),end=new Date(Math.max(wk,monday(parse(sorted[0].date)).getTime()));
 $('avg').textContent=fmt(sum(entries)/(Math.round((end-first)/(7*864e5))+1));
 const fresh=prevIds?sorted.filter(e=>!prevIds.has(e.id)):[];prevIds=new Set(sorted.map(e=>e.id));
 if(fresh.length&&window.fx&&fx.shake)fx.shake($('lwk'));
 sorted.forEach(e=>{
  const row=el('div',fresh.includes(e)?'log fxnew':'log');
  const a=el('div',null,parse(e.date).toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short',year:'numeric'}));
  if(e.note)a.appendChild(el('small',null,e.note));
  const b=el('b',null,'+'+fmt(e.min));
  const d=el('button','del','Slett');d.type='button';
  d.onclick=()=>{if(confirm('Slette denne registreringen?'))remove(e.id)};
  row.append(a,b,d);L.appendChild(row);
 });
}
load();
setInterval(()=>{if(!document.hidden)load()},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
<script src="/swipe.js" defer></script>
<script src="/fx.js" defer></script>
<script src="/fun.js" defer></script>
</body>
</html>
